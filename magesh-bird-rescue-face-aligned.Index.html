<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Magesh Bird Rescue</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a24;
  }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #top {
    width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; gap: 8px; color: #fff; flex-wrap: wrap;
  }
  #top h1 { font-size: 18px; margin: 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge { padding: 6px 10px; border-radius: 14px; background: #2c2c3d; border: 1px solid #444; color: #fff; font-size: 12px; font-weight: bold; }
  button.ctrl { border: 0; border-radius: 8px; padding: 8px 12px; font-weight: bold; cursor: pointer; background: #ff9800; color: #fff; box-shadow: 0 3px #e65100; font-size: 12px; }
  button.ctrl:active { transform: translateY(2px); box-shadow: 0 1px #e65100; }
  #game-container {
    position: relative; width: 100%; max-width: 900px; box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    border-radius: 12px; overflow: hidden; border: 3px solid #3a3a4c;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  #help {
    position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,0.85); padding: 7px 10px;
    border-radius: 10px; color: #234; font-size: 11px; max-width: 260px; pointer-events: none;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.72);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 2rem; margin-bottom: 8px; color: #ffeb3b; text-shadow: 2px 2px 4px #000; }
  #overlay p { font-size: 1.05rem; margin-bottom: 18px; max-width: 90%; color: #fff; }
  @media (max-width: 500px) {
    #top h1 { font-size: 14px; } .badge { font-size: 10px; padding: 5px 8px; } button.ctrl { padding: 6px 9px; font-size: 10px; }
    #help { font-size: 9px; max-width: 180px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <h1>🐦 Magesh Bird Rescue</h1>
    <div class="badges">
      <span class="badge" id="level-badge">Level 1</span>
      <span class="badge" id="goal-badge">Save Wasim</span>
      <span class="badge" id="tries-badge">Tries: 3</span>
      <button class="ctrl" id="restartBtn">↻ Restart Level</button>
    </div>
  </div>
  <div id="game-container">
    <canvas id="c" width="900" height="500"></canvas>
    <div id="help">Drag Magesh back on the slingshot and release to launch. Break the blocks and free your friend!</div>
    <div id="overlay">
      <h1 id="overlay-title">RESCUE MISSION</h1>
      <p id="overlay-msg">Magesh must save Wasim, Vishnu and Rajesh. You get 3 tries per level. Break the blocks so the cage falls apart!</p>
      <button class="ctrl" style="font-size:1rem;padding:12px 24px;" id="overlay-btn">START LEVEL 1</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

// ---------- Physics world ----------
let engine, world;
let birdBody = null;
let blockBodies = []; // { body, meta:{w,h,health,maxHealth,color} }
let cageMeta = null;  // { x,y,r, color, rescued }
let groundBody = null;

let currentLevel = 0;
let triesLeft = TRIES_PER_LEVEL;
let launched = false;
let dragging = false;
let waitingForSettle = false;
let settleTimer = 0;
let rescued = false;
let particles = [];
let trail = [];
let inputLocked = false;

function createEngine() {
  engine = Engine.create();
  world = engine.world;
  world.gravity.y = 1;
  groundBody = Bodies.rectangle(W/2, GROUND_Y + 20, W + 200, 40, { isStatic: true, friction: 0.9, label: 'ground' });
  Composite.add(world, groundBody);

  Events.on(engine, 'collisionStart', (evt) => {
    for (const pair of evt.pairs) {
      handlePair(pair.bodyA, pair.bodyB);
      handlePair(pair.bodyB, pair.bodyA);
    }
  });
}

function handlePair(a, b) {
  // Damage blocks on sufficiently hard impact
  if (a.label === 'block' && b.label === 'bird') {
    const rel = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
    if (rel > 0.75) {
      const meta = a.plugin.meta;
      Body.setVelocity(b, b.velocity);

      // Blocks are locked upright until Magesh actually hits them.
      // A strong impact releases the block so it can fall/break naturally.
      if (a.isStatic) {
        Body.setStatic(a, false);
      }

      meta.health -= rel * 4.0;
      if (meta.health <= 0 && !meta.dead) {
        meta.dead = true;
        spawnDebris(a.position.x, a.position.y, meta.color);
        Composite.remove(world, a);
      }
    }
  }
  // Cage rescue check: triggered by any moving body touching the cage zone
  if (a.label === 'cageSensor' && !rescued) {
    const speed = Vector.magnitude(b.velocity);
    if (speed > 1.0) {
      triggerRescue();
    }
  }
}

function spawnDebris(x, y, color) {
  for (let i = 0; i < 9; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 6 - 2,
      life: 1,
      color: color || '#8d6e63',
      size: 4 + Math.random() * 3
    });
  }
}

function buildLevel(idx) {
  // clear old bodies
  if (world) {
    Composite.clear(world, false);
    Composite.add(world, groundBody);
  }
  blockBodies = [];
  particles = [];
  trail = [];
  rescued = false;
  launched = false;
  dragging = false;
  waitingForSettle = false;
  inputLocked = false;

  const cfg = LEVELS[idx];

  // Blocks
  for (const b of cfg.blocks) {
    const body = Bodies.rectangle(b.x, b.y, b.w, b.h, {
      density: 0.0025,
      friction: 0.6,
      frictionAir: 0.001,
      restitution: 0.05,
      label: 'block',
      isStatic: true
    });
    body.plugin = { meta: { w: b.w, h: b.h, health: b.health, maxHealth: b.health, color: '#8d6e63', dead: false } };
    Composite.add(world, body);
    blockBodies.push(body);
  }

  // Cage sensor (visual + trigger zone, doesn't physically block movement)
  const cageSensor = Bodies.circle(cfg.cage.x, cfg.cage.y, cfg.cage.r, {
    isStatic: true,
    isSensor: true,
    label: 'cageSensor'
  });
  Composite.add(world, cageSensor);
  cageMeta = {
    x: cfg.cage.x, y: cfg.cage.y, r: cfg.cage.r, color: cfg.color,
    name: cfg.name, sensorBody: cageSensor,
    flying: false, flyX: cfg.cage.x, flyY: cfg.cage.y, flyVX: 0, flyVY: 0
  };

  // Bird
  birdBody = Bodies.circle(SLING.x, SLING.y, 22, {
    density: 0.006,
    friction: 0.5,
    frictionAir: 0.0008,
    restitution: 0.35,
    label: 'bird',
    isStatic: true
  });
  Composite.add(world, birdBody);

  // UI
  levelBadge.textContent = `Level ${idx + 1} (${cfg.difficulty})`;
  goalBadge.textContent = `Save ${cfg.name}`;
  triesLeft = TRIES_PER_LEVEL;
  triesBadge.textContent = `Tries: ${triesLeft}`;
}

function triggerRescue() {
  rescued = true;
  inputLocked = true;

  // Break the cage first.
  for (let i = 0; i < 22; i++) {
    spawnDebris(cageMeta.x, cageMeta.y, '#d7ccc8');
  }

  // Then let the rescued friend's real round face fly out.
  setTimeout(() => {
    cageMeta.flyX = cageMeta.x;
    cageMeta.flyY = cageMeta.y;
    cageMeta.flyVX = 3.8;
    cageMeta.flyVY = -6.2;
    cageMeta.flying = true;
  }, 180);

  // Finish the level after the friend has visibly flown away.
  setTimeout(() => {
    cageMeta.flying = false;
    if (currentLevel < LEVELS.length - 1) {
      overlayTitle.textContent = `LEVEL ${currentLevel + 1} CLEARED!`;
      overlayMsg.textContent = `Magesh rescued ${LEVELS[currentLevel].name}! Get ready for the next challenge.`;
      overlayBtn.textContent = `START LEVEL ${currentLevel + 2}`;
      currentLevel++;
      overlay.classList.remove('hidden');
    } else {
      overlayTitle.textContent = `VICTORY! ALL FRIENDS SAVED!`;
      overlayMsg.textContent = `Magesh rescued Wasim, Vishnu and Rajesh. Mission complete!`;
      overlayBtn.textContent = `PLAY AGAIN`;
      currentLevel = 0;
      overlay.classList.remove('hidden');
    }
  }, 1300);
}

function failLevel() {
  inputLocked = true;
  setTimeout(() => {
    overlayTitle.textContent = `OUT OF BIRDS!`;
    overlayMsg.textContent = `Magesh ran out of tries. Try Level ${currentLevel + 1} again.`;
    overlayBtn.textContent = `RETRY LEVEL ${currentLevel + 1}`;
    overlay.classList.remove('hidden');
  }, 500);
}

// ---------- Input ----------
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function onStart(e) {
  if (inputLocked || launched || !birdBody) return;
  const pos = getPos(e);
  const d = Math.hypot(pos.x - birdBody.position.x, pos.y - birdBody.position.y);
  if (d < 45) dragging = true;
}

function onMove(e) {
  if (!dragging || !birdBody) return;
  e.preventDefault();
  const pos = getPos(e);
  let dx = pos.x - SLING.x;
  let dy = pos.y - SLING.y;
  // The bird can only be pulled backward (left) from the sling.
  dx = Math.min(dx, -4);
  const dist = Math.min(Math.hypot(dx, dy), MAX_PULL);
  const len = Math.hypot(dx, dy) || 1;
  Body.setPosition(birdBody, {
    x: SLING.x + (dx / len) * dist,
    y: SLING.y + (dy / len) * dist
  });
}

function onEnd() {
  if (!dragging || !birdBody) return;
  dragging = false;
  launched = true;
  waitingForSettle = true;
  settleTimer = 0;
  triesLeft--;
  triesBadge.textContent = `Tries: ${triesLeft}`;

  // Launch speed is directly proportional to how far the player pulls.
  // Small pull = slow launch, large pull = fast launch.
  const dx = SLING.x - birdBody.position.x;
  const dy = SLING.y - birdBody.position.y;
  const pull = Math.min(Math.hypot(dx, dy), MAX_PULL);
  // Matter.js velocity is expressed in pixels per simulation step.
  // Scale directly from the player's pull distance: 20px pull is slow,
  // full 115px pull is fast enough to reach the structures.
  const speedFactor = 0.20;
  const scale = pull > 0 ? (speedFactor * pull / Math.max(pull, 1)) : 0;
  Body.setStatic(birdBody, false);
  Body.setVelocity(birdBody, {
    x: dx * speedFactor,
    y: dy * speedFactor
  });
}

canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onEnd);

overlayBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  buildLevel(currentLevel);
});

restartBtn.addEventListener('click', () => {
  buildLevel(currentLevel);
});

// ---------- Update / settle detection ----------
function checkSettle() {
  if (cageMeta && cageMeta.flying) {
    cageMeta.flyX += cageMeta.flyVX;
    cageMeta.flyY += cageMeta.flyVY;
    cageMeta.flyVY += 0.18;
  }
  if (!launched || rescued || inputLocked) return;
  const speed = Vector.magnitude(birdBody.velocity);
  const offScreen = birdBody.position.x > W + 60 || birdBody.position.x < -60 || birdBody.position.y > H + 100;
  if (offScreen) {
    resolveShotEnd();
    return;
  }
  if (speed < 0.25) {
    settleTimer += 1;
    if (settleTimer > 45) resolveShotEnd();
  } else {
    settleTimer = 0;
  }
}

function resolveShotEnd() {
  waitingForSettle = false;
  launched = false;
  if (rescued) return;
  if (triesLeft > 0) {
    Body.setStatic(birdBody, true);
    Body.setPosition(birdBody, { x: SLING.x, y: SLING.y });
    Body.setVelocity(birdBody, { x: 0, y: 0 });
    Body.setAngularVelocity(birdBody, 0);
  } else {
    failLevel();
  }
}

// ---------- Drawing ----------
function drawBird(x, y, r, color, name, angle) {
  const img = FACE_IMAGES[name];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle || 0);

  // Perfect circular face: the photo itself fills the complete circle.
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -r, -r, r * 2, r * 2);
  } else {
    ctx.fillStyle = color || '#ddd';
    ctx.fillRect(-r, -r, r * 2, r * 2);
  }

  ctx.restore();

  // Clean circular border only; no eyes, beak, or cartoon overlay.
  ctx.strokeStyle = '#202020';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(name, x, y - r - 7);
}

function drawScene() {
  ctx.clearRect(0, 0, W, H);

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#70c5ce');
  sky.addColorStop(1, '#bde3e8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // ground
  ctx.fillStyle = '#689f38';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#4ea221';
  ctx.fillRect(0, GROUND_Y, W, 10);

  // slingshot back post
  ctx.strokeStyle = '#4e2a1e';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(SLING.x + 6, SLING.y);
  ctx.lineTo(SLING.x + 12, SLING.y + 55);
  ctx.stroke();

  // trajectory preview
  if (dragging) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    let sx = birdBody.position.x, sy = birdBody.position.y;
    let svx = (SLING.x - sx) * 0.20;
    let svy = (SLING.y - sy) * 0.20;
    ctx.moveTo(sx, sy);
    for (let i = 0; i < 22; i++) {
      svy += 1.0;
      sx += svx * 0.06;
      sy += svy * 0.06;
      ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // trail
  if (launched) {
    trail.push({ x: birdBody.position.x, y: birdBody.position.y, life: 1 });
    if (trail.length > 18) trail.shift();
  }
  for (const t of trail) {
    ctx.globalAlpha = t.life * 0.3;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 5, 0, Math.PI * 2);
    ctx.fill();
    t.life -= 0.06;
  }
  ctx.globalAlpha = 1;
  trail = trail.filter(t => t.life > 0);

  // bird
  if (birdBody) {
    drawBird(birdBody.position.x, birdBody.position.y, 22, '#e53935', 'Magesh', birdBody.angle);
  }

  // slingshot band + front post
  if (dragging) {
    ctx.strokeStyle = '#2c1609';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(SLING.x - 10, SLING.y - 2);
    ctx.lineTo(birdBody.position.x, birdBody.position.y);
    ctx.lineTo(SLING.x + 10, SLING.y - 2);
    ctx.stroke();
  }
  ctx.strokeStyle = '#5d3222';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(SLING.x - 6, SLING.y);
  ctx.lineTo(SLING.x - 12, SLING.y + 55);
  ctx.stroke();

  // blocks
  for (const body of blockBodies) {
    if (body.plugin.meta.dead) continue;
    const m = body.plugin.meta;
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.rotate(body.angle);
    const dmg = 1 - Math.max(0, m.health) / m.maxHealth;
    const r = Math.round(141 - dmg * 40);
    const g = Math.round(110 - dmg * 50);
    const b = Math.round(99 - dmg * 50);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(-m.w / 2, -m.h / 2, m.w, m.h);
    ctx.strokeStyle = '#4a3527';
    ctx.lineWidth = 2;
    ctx.strokeRect(-m.w / 2, -m.h / 2, m.w, m.h);
    // crack lines when damaged
    if (dmg > 0.4) {
      ctx.strokeStyle = 'rgba(30,20,15,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-m.w / 4, -m.h / 2);
      ctx.lineTo(m.w / 6, m.h / 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // cage + friend
  if (cageMeta) {
    const cfg = LEVELS[currentLevel];
    if (cageMeta.flying) {
      drawBird(cageMeta.flyX, cageMeta.flyY, 24, cageMeta.color, cageMeta.name, 0);
    } else {
      drawBird(cageMeta.x, cageMeta.y, 15, cageMeta.color, cageMeta.name, 0);
    }
    if (!rescued) {
      ctx.strokeStyle = '#d7ccc8';
      ctx.lineWidth = 3;
      const r = cageMeta.r;
      ctx.strokeRect(cageMeta.x - r, cageMeta.y - r, r * 2, r * 2);
      for (let i = -r + 8; i < r; i += 9) {
        ctx.beginPath();
        ctx.moveTo(cageMeta.x + i, cageMeta.y - r);
        ctx.lineTo(cageMeta.x + i, cageMeta.y + r);
        ctx.stroke();
      }
    }
  }

  // debris particles
  for (const p of particles) {
    p.vy += 0.4;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  particles = particles.filter(p => p.life > 0);
  ctx.globalAlpha = 1;
}

// ---------- Main loop ----------
let lastTime = performance.now();
function loop(t) {
  const dt = Math.min(33, t - lastTime);
  lastTime = t;
  Engine.update(engine, dt);
  checkSettle();
  drawScene();
  requestAnimationFrame(loop);
}

createEngine();
buildLevel(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
